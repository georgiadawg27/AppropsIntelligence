# Regenerate the static site (docs/, served by GitHub Pages) whenever a new
# reference workbook -- or anything the export depends on -- is committed.
# The export is deterministic, so a run that changes nothing commits nothing.
# Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
name: Export static site

on:
  push:
    paths:
      - "reference/*.xlsx"
      - "approps_store.py"
      - "approps_web.py"
      - "accounts.py"
      - "store_schema.sql"
      - "export_static.py"
      - "web/**"
      - ".github/workflows/export-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the workbook's commit date goes into the page
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install export dependencies
        run: pip install openpyxl
      - name: Export docs/ from the committed reference workbook
        run: python export_static.py
      - name: Commit docs/ if it changed
        run: |
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ unchanged -- nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate static export (docs/) from $(basename reference/*.xlsx)" \
                     -m "Automated by .github/workflows/export-static.yml for ${GITHUB_SHA::7}."
          git push origin "HEAD:${GITHUB_REF_NAME}"
