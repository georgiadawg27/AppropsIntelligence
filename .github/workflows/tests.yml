# The full test suite, on every pull request and every push to main.
# export-static.yml also calls it (workflow_call) and commits docs/ only when
# it passes on that same commit.
#
# Two jobs run side by side, each with pytest-xdist across the runner's CPUs:
#   data     -- builds the workbook from data/staged.json (scripts/build_workbook.py, which stops on
#               any failed check), runs the bill and law text check (scripts/check_legislative_text.py,
#               offline), recalculates it in LibreOffice and fails on any formula error,
#               checks the site's copy (lookup results stored) against LibreOffice's results,
#               uploads it as an artifact, then runs the store, ingest, extraction and build tests
#               (every module but the three below)
#   browser  -- the page: tests/test_web.py, test_compare.py, test_static.py (playwright + node)
# The toolchain is pinned: ubuntu-24.04, Python 3.11.17, requirements.lock (exact package versions) and
# an exact LibreOffice build. A pull request doesn't commit docs/Approps_Pilot_Schema_Loaded.xlsx (the
# `changes` job fails if it does): only export-static.yml on main writes it.
# A change that touches only the page (web/, docs/, screenshots/, the three page test
# modules, Markdown) can't affect the data tests, so `data` skips its steps for it; a change
# under data/ or scripts/ is not page-only, so it runs them. The
# workflow itself always runs, and `test` always reports: it passes only when both jobs did.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      network:
        description: "Run the network tests (tests/test_ingest.py Live*, which call api.govinfo.gov)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      data: ${{ steps.paths.outputs.data }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change reach the data tests?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          # no base to compare (manual run, new branch, unknown history): run everything
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "data=true" >> "$GITHUB_OUTPUT"; echo "no comparable base -- running every test"; exit 0
          fi
          changed=$(git diff --name-only "$(git merge-base "$base" HEAD)" HEAD)
          echo "$changed"
          # one builder: only the export job on main (export-static.yml) writes the Download workbook, so a
          # pull request never commits it; its content is checked against the data instead (test_static.py)
          if [ "$EVENT" = "pull_request" ] && echo "$changed" | grep -qx 'docs/Approps_Pilot_Schema_Loaded.xlsx'; then
            echo "::error file=docs/Approps_Pilot_Schema_Loaded.xlsx::a pull request doesn't commit the Download workbook; CI's export job on main writes it. Restore it: git checkout origin/main -- docs/Approps_Pilot_Schema_Loaded.xlsx"
            exit 1
          fi
          page_only='^(web/|docs/|screenshots/|tests/test_(web|compare|static)\.py$|.*\.md$)'
          if [ -n "$changed" ] && ! echo "$changed" | grep -Eqv "$page_only"; then
            echo "data=false" >> "$GITHUB_OUTPUT"; echo "page-only change -- the data tests are skipped"
          else
            echo "data=true" >> "$GITHUB_OUTPUT"
          fi

  data:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Page-only change
        if: needs.changes.outputs.data != 'true'
        run: echo "Only the page changed (web/, docs/, screenshots/, page tests, Markdown) -- nothing here to run."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.data == 'true'
        with:
          fetch-depth: 0          # tests read the workbook's commit date
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.data == 'true'
        with:
          python-version: "3.11.17"    # .python-version; the README notes the pinned toolchain
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        if: needs.changes.outputs.data == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pip install -r requirements.lock
      - name: Build the workbook from data/staged.json
        if: needs.changes.outputs.data == 'true'
        # the script runs its own checks first (allowed values, broken references, duplicate IDs,
        # effective dates, govinfo landing pages, enactment fields off Enacted rows) and stops on any
        run: mkdir -p build && python scripts/build_workbook.py
      - name: Bill and law text check (offline)
        if: needs.changes.outputs.data == 'true'
        # every House, Senate and Enacted figure against its stage's committed bill or law text
        # (data/legislative_text/); fails on a stage with no text and no exemption, a text file from another
        # parser version, or check results in data/staged.json that are out of date. The summary (counts and the
        # change since the base branch) goes to the job summary.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi
          if [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          args=""
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base "$base" HEAD)" >/dev/null
            args="--base-dir $RUNNER_TEMP/base"
          fi
          python scripts/check_legislative_text.py --ci $args
      - name: Components and measure_reconcile (offline)
        if: needs.changes.outputs.data == 'true'
        # accounting views, phase 1 (reference/ACCOUNTING_RULES.md): the tagged components in data/staged.json
        # are what scripts/tag_components.py gives from the committed data and text, and the measure_reconcile
        # records are up to date; each writes its summary to the job summary
        run: |
          python scripts/tag_components.py --ci
          python scripts/measure_reconcile.py --ci
      - name: Install LibreOffice (headless recalculation), pinned
        if: needs.changes.outputs.data == 'true'
        # exact versions (the README notes them): a different LibreOffice could recalculate differently, so
        # the install fails rather than take another one. The runner's mirror drops a build as soon as Ubuntu
        # replaces it, so the pinned build comes from Ubuntu's snapshot archive as of UBUNTU_SNAPSHOT, which
        # keeps it for good; moving to a newer LibreOffice means changing these values together.
        env:
          UBUNTU_SNAPSHOT: "20261012T044000Z"
          LIBREOFFICE: "4:24.2.7-0ubuntu0.24.04.7"
          LIBREOFFICE_VERSION: "LibreOffice 24.2.7.2"
          OPENPYXL_DEB: "3.1.2+dfsg-6"
        run: |
          for suite in noble noble-updates noble-security; do
            echo "deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/$UBUNTU_SNAPSHOT $suite main universe"
          done | sudo tee /etc/apt/sources.list.d/ubuntu-snapshot.list
          sudo apt-get update -q
          apt-cache policy libreoffice-calc python3-uno python3-openpyxl | grep -E '^\S|Candidate|^ +[0-9*]' || true
          sudo apt-get install -y -q --no-install-recommends \
            "libreoffice-calc=$LIBREOFFICE" "libreoffice-core=$LIBREOFFICE" "libreoffice-common=$LIBREOFFICE" \
            "python3-uno=$LIBREOFFICE" "python3-openpyxl=$OPENPYXL_DEB"
          v=$(soffice --version | tee -a "$GITHUB_STEP_SUMMARY")
          echo "$v"
          case "$v" in "$LIBREOFFICE_VERSION "*) ;; *) echo "::error::expected $LIBREOFFICE_VERSION, got $v"; exit 1;; esac
      - name: Recalculate in LibreOffice; fail on any formula error
        if: needs.changes.outputs.data == 'true'
        # the system python3 is the one with LibreOffice's uno bridge
        run: |
          set -o pipefail
          /usr/bin/python3 scripts/recalc_check.py build/Approps_Pilot_Schema_Loaded.xlsx | tee build/recalc.txt
          cat build/recalc.txt >> "$GITHUB_STEP_SUMMARY"
      - name: The site's workbook -- its stored lookup results equal LibreOffice's
        if: needs.changes.outputs.data == 'true'
        # approps_store.reference_workbook(): the same build with each lookup formula's result
        # stored (calculate_lookups); what the store, the site and the Download link use
        run: |
          set -o pipefail
          python -c "import approps_store as S; print(S.reference_workbook())"
          /usr/bin/python3 scripts/recalc_check.py build/site/Approps_Pilot_Schema_Loaded.xlsx --compare-cached \
            | tee -a build/recalc.txt
          tail -1 build/recalc.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the built workbook
        if: needs.changes.outputs.data == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Approps_Pilot_Schema_Loaded
          path: build/Approps_Pilot_Schema_Loaded.xlsx
          if-no-files-found: error
      - name: Fetch the source documents the tests read
        if: needs.changes.outputs.data == 'true'
        # document_store/ is gitignored; these are public govinfo PDFs (no key).
        # A failed fetch leaves its tests skipped with that reason, not failed.
        run: |
          mkdir -p document_store
          for p in CRPT-119hrpt652 CRPT-119srpt44 CRPT-118srpt62 CRPT-119srpt55 PLAW-118publ47; do
            curl -fsSL --retry 3 -o "document_store/$p.pdf" "https://www.govinfo.gov/content/pkg/$p/pdf/$p.pdf" \
              || { echo "::warning::could not fetch $p -- its tests will skip"; rm -f "document_store/$p.pdf"; }
          done
          # the Labor-HHS FY2026 JES: the Congressional Record granule it was ingested from
          # (document_store/manifest.json source_url), kept only if its bytes are the ingested ones
          jes=document_store/MANUAL-LHHS-FY2026-Enacted-jes-e44f7662.pdf
          if curl -fsSL --retry 3 -o "$jes" \
               "https://www.govinfo.gov/content/pkg/CREC-2026-01-22/pdf/CREC-2026-01-22-pt2-PgH1353-2.pdf" \
             && echo "e44f766294e2f7fc9d38c86ac307a27b4f3405d2654085e03b2b71eed90b9f75  $jes" | sha256sum -c --quiet; then :
          else echo "::warning::Labor-HHS JES not fetched or not the ingested bytes -- its tests will skip"; rm -f "$jes"; fi
      - name: Run the data tests
        if: needs.changes.outputs.data == 'true'
        # the four live govinfo API tests (tests/test_ingest.py Live*, marked `network`) call an
        # outside service, so they skip unless asked for: run this workflow by hand with
        # "Run the network tests" ticked (they also need the GOVINFO_API_KEY secret)
        env:
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          RUN_NETWORK_TESTS: ${{ inputs.network && '1' || '' }}
        run: >
          python -m pytest tests -v -rs -p no:cacheprovider -n auto --dist loadscope --durations=10
          --ignore=tests/test_web.py --ignore=tests/test_compare.py --ignore=tests/test_static.py

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the static export reads the workbook's commit date
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"    # .python-version; the README notes the pinned toolchain
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4     # tests/test_static.py: match.js parity under node
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Browser cache key
        id: pw
        run: echo "key=pw-chromium-${{ runner.os }}-$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Reuse the installed Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw.outputs.key }}
      - name: Install Chromium (first run for this playwright version)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD= python -m playwright install --with-deps chromium
      - name: Point the tests at Chromium
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(f"PLAYWRIGHT_CHROMIUM={p.chromium.executable_path}")
          PY
      - name: System libraries for Chromium (only if the runner lacks them)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          python - <<'PY' || python -m playwright install-deps chromium
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              p.chromium.launch().close()
          PY
      - name: Run the browser tests
        env:
          # matcher parity: a fixed, seeded ~1,500-query sample across query kinds on pull requests;
          # all 14,574 queries on pushes to main (tests/test_static.py MatcherParity)
          PARITY_SAMPLE: ${{ github.event_name == 'pull_request' && '1500' || '' }}
        run: >
          python -m pytest tests/test_web.py tests/test_compare.py tests/test_static.py -v -rs -p no:cacheprovider
          -n auto --dist loadscope --durations=10

  # the check to require: always reports, and passes only when both jobs passed
  # (data counts as passed when a page-only change skipped its steps)
  test:
    needs: [changes, data, browser]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Both jobs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          DATA: ${{ needs.data.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "changes=$CHANGES data=$DATA browser=$BROWSER"
          [ "$CHANGES" = success ] && [ "$DATA" = success ] && [ "$BROWSER" = success ]
