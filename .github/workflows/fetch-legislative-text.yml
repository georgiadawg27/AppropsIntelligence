# Fetch bill and law text (data/legislative_text/) -- by hand only, never on a pull request or a push.
# Runs scripts/fetch_legislative_text.py with the GOVINFO_API_KEY repository secret (sent as a request header,
# never printed or saved), then scripts/check_legislative_text.py --write, and commits data/ back to the branch
# it was started on. Start it on a branch, not main, and open a pull request: the Tests workflow then runs the
# offline check on the new text.
name: Fetch bill and law text

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "missing: documents with no text file yet; all: fetch every document again; reparse: re-parse the cached downloads (fetches them again here)"
        type: choice
        options: [missing, all, reparse]
        default: missing
      documents:
        description: "Only these document ids, space-separated (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-legislative-text-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Not on the default branch
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Start this workflow on a branch and open a pull request; it does not commit to ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.17"
          cache: pip
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pip install -r requirements.lock
      - name: Fetch and parse
        env:
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          MODE: ${{ inputs.mode }}
          DOCUMENTS: ${{ inputs.documents }}
        run: |
          args=""
          if [ "$MODE" = "all" ] || [ "$MODE" = "reparse" ]; then args="--all"; fi
          if [ -n "$DOCUMENTS" ]; then args="$args --only $DOCUMENTS"; fi
          python scripts/fetch_legislative_text.py $args | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Write the check's results into data/staged/
        run: python scripts/check_legislative_text.py --write | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit data/ if it changed
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bill and law text: fetch ($MODE) and check results" \
                     -m "Automated by .github/workflows/fetch-legislative-text.yml."
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          MODE: ${{ inputs.mode }}
