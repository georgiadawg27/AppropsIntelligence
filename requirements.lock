# Exact versions of everything CI installs (requirements.txt plus pytest and pytest-xdist), for Python 3.11.17 on
# ubuntu-24.04. CI installs this file, never the open ranges in requirements.txt, so the workbook build and the
# tests run on the same packages every time. Regenerate after changing requirements.txt:
#   uv pip compile requirements.txt <(printf "pytest\npytest-xdist\n") --python-version 3.11 \
#     --python-platform x86_64-manylinux_2_39 --no-header --no-annotate -o requirements.lock
# (then put this comment back). The workbook build itself uses only openpyxl and et-xmlfile.
